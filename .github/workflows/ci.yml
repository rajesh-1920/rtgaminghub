name: CI

on:
  push:
    branches: [main, bat-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:css
      - run: node --check src/js/main.js
      - run: node --check src/js/utils/helpers.js
      - run: node --check src/js/sound.js
      - run: node --check sw.js
      - run: node --check scripts/sitemap.mjs
      - run: node --check scripts/validate.mjs
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run validate
      - run: npm run sitemap

  test-links:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:css
      - name: Check for broken internal links
        run: |
          npx markdown-link-check README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md --config .markdownlinkcheck.json || true
      - name: Check HTML links
        run: |
          npx htmlhint index.html 404.html offline.html games/*/home.html --rule 'tagname-lowercase:true' 'attr-lowercase:true' 'attr-value-double-quotes:true' 'doctype-first:true' 'tag-pair:true' 'spec-char-escape:true' 'id-unique:true' 'src-not-empty:true' 'alt-require:true' 'title-require:true' --format unix || true