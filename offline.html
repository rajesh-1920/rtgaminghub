<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Offline - RTGamingHub</title>
    <link rel="stylesheet" href="./src/css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div class="text-center animate-fade-in-up">
      <div class="text-6xl mb-4">📴</div>
      <h2 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-6">You're Offline</h2>
      <p class="text-gray-600 mb-8 max-w-md mx-auto">
        It looks like you've lost your internet connection. Don't worry — your game scores are saved
        locally and will sync when you're back online!
      </p>
      <button onclick="window.location.reload()" class="btn-primary">Try Again</button>
      <p class="mt-4 text-sm text-gray-500">
        Or <a href="/" class="text-blue-600 hover:underline">go home</a> when back online.
      </p>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () =>
          window.location.reload()
        );
      }
    </script>
  </body>
</html>
