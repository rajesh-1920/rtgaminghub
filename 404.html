<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - Page Not Found | RTGamingHub</title>
    <link rel="stylesheet" href="./src/css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div class="text-center animate-fade-in-up">
      <h1 class="text-6xl font-bold text-gray-200 mb-4">404</h1>
      <h2 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-6">Oops! Page not found</h2>
      <p class="text-gray-600 mb-8 max-w-md mx-auto">
        The page you're looking for doesn't exist or has been moved. Let's get you back to the
        games!
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/" class="btn-primary">Back to Home</a>
        <a
          href="#games"
          class="px-6 py-3 border-2 border-purple-600 text-purple-600 font-semibold rounded-lg hover:bg-purple-50 transition-all duration-300"
          >Browse Games</a
        >
      </div>
      <p class="mt-8 text-sm text-gray-400">
        If you think this is a mistake,
        <a
          href="https://github.com/yourusername/rtgaminghub/issues"
          class="text-blue-600 hover:underline"
          >report an issue</a
        >.
      </p>
    </div>
  </body>
</html>
