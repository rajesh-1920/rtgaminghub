<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/home.css" />
    <title>bat-ball-stamp</title>
  </head>
  <body>
    <!-- header section start -->
    <header>header</header>
    <!-- main section start -->
    <main>
      <p class="welcome-container">Welcome to the Bat-Ball-Stump game.</p>
      <div class="icon-container">
        <button id="bat-icon" class="icon-button">
          <img src="./assets/images/bat.png" alt="bat-icon" />
        </button>
        <button id="ball-icon" class="icon-button">
          <img src="./assets/images/ball.png" alt="ball-icon" />
        </button>
        <button id="stamp-icon" class="icon-button">
          <img src="./assets/images/stump.png" alt="stump-icon" />
        </button>
      </div>
      <div class="message-container">Select an item.</div>
      <div class="result-container">Score</div>
      <button class="reset-button">Reset</button>
    </main>
    <!-- footer section start -->
    <footer>footer</footer>
    <script src="./assets/js/home.js"></script>
  </body>
</html>
