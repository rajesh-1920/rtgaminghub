<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="./assets/css/home.css">
</head>

<body>
    <!-- header section -->
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
    <!-- main section -->
    <main>
        <p>Welcome</p>
        <div class="playground">
            <div class="circle" id="rock"></div>
            <div class="circle" id="paper"></div>
            <div class="circle" id="scissors"></div>
        </div>
        <p class="result">Start</p>
        <p>Your Score : <span id="your-score">0</span></p>
        <p>Computer Score : <span id="computer-score">0</span></p>
    </main>
    <!-- footer section -->
    <footer>
        @copyright all preserves Rajesh Biswas.
    </footer>
    <script src="./assets/js/home.js"></script>
</body>

</html>
