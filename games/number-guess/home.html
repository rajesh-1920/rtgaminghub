<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Number Guess — guess the secret number 1-100 on RTGamingHub." />
  <title>Number Guess | RTGamingHub</title>
  <link rel="stylesheet" href="./assets/css/home.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">← Back to Games</a>
  <main class="wrap">
    <h1>Number Guess 🔢</h1>
    <p class="subtitle">I'm thinking of a number 1–100. You have 7 tries.</p>
    <form id="form">
      <label for="guess" class="sr">Your guess</label>
      <input id="guess" type="number" min="1" max="100" required placeholder="1–100" />
      <button type="submit">Guess</button>
    </form>
    <p id="status" role="status" aria-live="polite">Make your first guess!</p>
    <p class="meta">Attempts left: <span id="left">7</span> • Best: <span id="best">—</span></p>
    <ul id="history" aria-live="polite"></ul>
    <button id="restart" type="button">New game</button>
  </main>
  <script src="./assets/js/home.js"></script>
</body>
</html>
