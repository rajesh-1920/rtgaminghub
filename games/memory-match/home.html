<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Memory Match — flip cards and find all pairs on RTGamingHub." />
  <title>Memory Match | RTGamingHub</title>
  <link rel="stylesheet" href="./assets/css/home.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">← Back to Games</a>
  <main class="wrap">
    <h1>Memory Match 🧠</h1>
    <p class="subtitle">Find all 6 pairs in as few moves as possible</p>
    <div class="meta" aria-live="polite">Moves: <span id="moves">0</span> • Pairs: <span id="pairs">0</span>/6 • Best: <span id="best">—</span></div>
    <div id="board" class="board" role="grid" aria-label="Memory board"></div>
    <div class="controls">
      <button id="restart" type="button">Restart</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./assets/js/home.js"></script>
</body>
</html>
